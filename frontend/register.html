<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Chroma Blend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand">
          <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="14" stroke="#2D2B28" stroke-width="1.5"/>
            <path d="M11 20C12.5 14 19.5 14 21 20" stroke="#9688A6" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="16" cy="11" r="2.5" fill="#758D9E"/>
          </svg>
          <span class="serif-font" style="font-size: 1.25rem; letter-spacing: 0.08em; text-transform: uppercase;">Chroma Blend</span>
        </div>
        <h1 class="auth-title">Begin your days.</h1>
        <p class="auth-subtitle">Create your personal productivity workspace.</p>
      </div>

      <div id="auth-error" class="error-banner"></div>

      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="name" class="form-label">Full name</label>
          <input type="text" id="name" class="form-input" placeholder="e.g. Alice Morgan" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <div class="form-label">
            <span>Private PIN code</span>
            <span class="form-hint">4–8 digits (Default: 1984)</span>
          </div>
          <input type="password" id="passcode" class="form-input" placeholder="1984" pattern="\d{4,8}" inputmode="numeric" autocomplete="off">
        </div>

        <button type="submit" class="btn-primary auth-btn">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
