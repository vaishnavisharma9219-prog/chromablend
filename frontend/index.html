<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chroma Blend — Daily Productivity Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .splash-hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      text-align: center;
    }
    .splash-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 3.5rem 3rem;
      max-width: 540px;
      width: 100%;
      box-shadow: var(--shadow-md);
      animation: fadeIn 0.4s ease;
    }
    .splash-logo {
      margin-bottom: 1.5rem;
    }
    .splash-title {
      font-size: 2.4rem;
      margin-bottom: 0.75rem;
    }
    .splash-desc {
      font-size: 1.05rem;
      color: var(--text-secondary);
      margin-bottom: 2.25rem;
      line-height: 1.6;
    }
    .splash-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
  </style>
</head>
<body>
  <main class="splash-hero">
    <div class="splash-card">
      <div class="splash-logo">
        <svg width="44" height="44" viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="14" stroke="#2D2B28" stroke-width="1.5"/>
          <path d="M11 20C12.5 14 19.5 14 21 20" stroke="#9688A6" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="16" cy="11" r="2.5" fill="#758D9E"/>
        </svg>
      </div>
      <h1 class="splash-title">Chroma Blend</h1>
      <p class="splash-desc">
        A calm, editorial productivity space for your daily rhythm, personal notes, and focused agendas.
      </p>
      <div class="splash-actions">
        <a href="/login.html" class="btn-primary" style="padding: 0.75rem 1.5rem;">Sign In</a>
        <a href="/register.html" class="btn-secondary" style="padding: 0.75rem 1.5rem;">Get Started</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    // Automatic redirect if already signed in
    (async function() {
      try {
        const res = await API.get('/auth/me');
        if (res && res.data) {
          window.location.replace('/planner.html');
        }
      } catch (err) {
        // Stay on splash page
      }
    })();
  </script>
</body>
</html>
